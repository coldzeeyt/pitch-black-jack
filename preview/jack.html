<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jack Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0807; overflow: hidden; color: #e9e2cf; font: 14px Georgia, serif; }
  canvas { display: block; }
  #ui { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: #1a1512; color: #e9e2cf; border: 1px solid #3a302a; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
</head>
<body>
<div id="ui">
  <button data-view="player">Player view</button>
  <button data-view="close">Close</button>
  <button data-view="three">3/4</button>
  <button data-view="side">Side</button>
  <button data-view="lit">Studio light</button>
  <button data-view="full">Full body</button>
  <button id="reach">Reach for shoe</button>
</div>
<script type="module">
import * as THREE from 'three';
import { createJack } from '../src/jack.js';

const TABLE_Y = 0.92;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x120e0c);
scene.fog = new THREE.FogExp2(0x120e0c, 0.08);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 50);

const hemi = new THREE.HemisphereLight(0x3a2c22, 0x050403, 0.35);
scene.add(hemi);
const spot = new THREE.SpotLight(0xffc98a, 60, 9, 0.78, 0.55, 1.6);
spot.position.set(0, 3.15, 0.95);
spot.target.position.set(0, TABLE_Y, 0.85);
spot.castShadow = true;
spot.shadow.mapSize.set(2048, 2048);
spot.shadow.bias = -0.0004;
spot.shadow.normalBias = 0.02;
scene.add(spot, spot.target);
const fill = new THREE.PointLight(0x7a5a3a, 0.6, 6, 1.5);
fill.position.set(0, 1.6, 2.6);
scene.add(fill);
const studio = new THREE.DirectionalLight(0xffffff, 0);
studio.position.set(1.5, 2.5, 3);
const back = new THREE.DirectionalLight(0xffffff, 0);
back.position.set(2, 2, -3);
scene.add(back);
scene.add(studio);

// slice of table + floor
const felt = new THREE.Mesh(new THREE.BoxGeometry(4, 0.1, 2.4), new THREE.MeshStandardMaterial({ color: 0x1f5a3a, roughness: 0.95 }));
felt.position.set(0, TABLE_Y - 0.05, 1.2);
felt.receiveShadow = true;
scene.add(felt);
const rail = new THREE.Mesh(new THREE.BoxGeometry(4.1, 0.08, 0.1), new THREE.MeshStandardMaterial({ color: 0x3c1e10, roughness: 0.5 }));
rail.position.set(0, TABLE_Y - 0.02, -0.03);
scene.add(rail);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x1c120b }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.55), new THREE.MeshStandardMaterial({ color: 0x0b0b0b }));
shoe.position.set(1.3, TABLE_Y + 0.1, 0.08);
shoe.rotation.y = -0.35;
scene.add(shoe);

const jack = createJack({ tableY: TABLE_Y });
jack.object.position.set(0, 0, -0.32);
scene.add(jack.object);

const views = {
  player: { pos: [0, 2.05, 3.35], look: [0, 1.08, 0.5], fov: 50, studio: 0 },
  close: { pos: [0.15, 1.75, 1.35], look: [0, 1.45, -0.3], fov: 40, studio: 0 },
  three: { pos: [1.7, 1.8, 1.6], look: [0, 1.3, -0.3], fov: 40, studio: 0 },
  side: { pos: [2.3, 1.5, -0.3], look: [0, 1.35, -0.3], fov: 40, studio: 0 },
  lit: { pos: [0.9, 1.7, 1.5], look: [0, 1.35, -0.3], fov: 40, studio: 2.5 },
  full: { pos: [2.4, 1.3, -2.2], look: [0, 0.95, -0.32], fov: 45, studio: 2.5 },
};
function setView(name) {
  const v = views[name];
  camera.position.set(...v.pos);
  camera.lookAt(...v.look);
  camera.fov = v.fov;
  camera.updateProjectionMatrix();
  studio.intensity = v.studio;
  back.intensity = name === 'full' ? 2 : 0;
  hemi.intensity = v.studio ? 1.2 : 0.35;
  jack.look(camera.position);
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
let reaching = false;
document.getElementById('reach').addEventListener('click', () => {
  reaching = !reaching;
  jack.reach(reaching ? new THREE.Vector3(1.2, TABLE_Y + 0.2, 0.15) : null, 1);
});
const q = new URLSearchParams(location.search);
setView(q.get('view') || 'player');
if (q.get('reach')) { reaching = true; jack.reach(new THREE.Vector3(1.2, TABLE_Y + 0.2, 0.15), 1); }

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  jack.update(dt, clock.elapsedTime);
  renderer.render(scene, camera);
});
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
window.ready = true;
</script>
</body>
</html>
